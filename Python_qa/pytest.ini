[pytest]
testpaths = Python_qa/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --html=reports/report.html --self-contained-html
markers =
    smoke: smoke tests
    regression: regression tests
    integration: integration tests
    OpsWarm: OpSwarmer tests
    IS: IS tests
    HVA: Helix Virtual Agent tests
    AIOPS: AIOps tests
    EN:Employee Navigator tests
    ITSM: ITSM tests